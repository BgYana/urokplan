ktor {
    application {
        modules = [ urokplan.app.ApplicationKt.module ]
    }
    deployment {
        port = 8080
        port = ${?PORT}
    }
}

database {
    jdbcUrl = "jdbc:postgresql://localhost:5432/urokplan"
    jdbcUrl = ${?DB_URL}
    username = "urokplan"
    username = ${?DB_USER}
    password = ${DB_PASSWORD}
    maximumPoolSize = 10
    maximumPoolSize = ${?DB_POOL_SIZE}
}
