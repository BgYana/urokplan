services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: urokplan
      POSTGRES_USER: urokplan
      POSTGRES_PASSWORD: urokplan
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U urokplan -d urokplan"]
      interval: 2s
      timeout: 3s
      retries: 15

  app:
    build: .
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/urokplan
      DB_USER: urokplan
      DB_PASSWORD: urokplan
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
